name: Baseline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: 21

jobs:
  size:
    name: Guard the binary size against the baseline
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin
      - name: Read the pinned demo commit
        id: baseline
        run: echo "demo=$(node -p "require('./plugin/benchmarks/baseline.json').demo.commit")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hotcodepush-team/cordova-code-push-demo
          ref: ${{ steps.baseline.outputs.demo }}
          path: demo
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: plugin/.nvmrc
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Pack the plugin from this pull request
        working-directory: plugin
        run: npm ci && npm run build && npm pack --pack-destination "$RUNNER_TEMP"
      - name: Prepare the demo with the plugin
        run: node plugin/benchmarks/prepare-demo.mjs demo "$RUNNER_TEMP/with" with "$(ls "$RUNNER_TEMP"/hotcodepush-cordova-code-push-*.tgz)"
      # The demo's build.json signs the release build with the debug keystore, which the Android Gradle plugin
      # creates only for a signing config named debug, so a fresh runner may have none; it is generated with the
      # public defaults.
      - name: Create the debug keystore
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi
      - name: Measure the sizes and compare them with the baseline
        run: node plugin/benchmarks/measure-size.mjs "$RUNNER_TEMP/with" > "$RUNNER_TEMP/sizes.json" && node plugin/benchmarks/guard-size.mjs plugin/benchmarks/baseline.json "$RUNNER_TEMP/sizes.json" >> "$GITHUB_STEP_SUMMARY"
