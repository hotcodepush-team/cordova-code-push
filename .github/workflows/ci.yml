name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: 21

jobs:
  web:
    name: Lint and build the TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx eslint . && npx prettier --check .
      - run: npm test
      - run: npm run build
      - run: npx pkg-pr-new publish --commentWithSha
  android-tests:
    name: Test the plugin's Kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - run: npm run test:android
  android:
    name: Build the plugin into an Android app (cordova-android ${{ matrix.cordova-android }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The two majors the plugin supports.
        cordova-android: ['15.1.0', '14.0.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - run: npm ci
      - run: npm run verify:android -- ${{ matrix.cordova-android }}
  ios:
    name: Test the plugin's Swift and build it into an iOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: brew install swiftlint
      - run: swiftlint lint --quiet --strict
      # The Xcode build step's tests run on macOS alone.
      - run: npm test
      # On Mac Catalyst, which boots no simulator.
      - run: npm run test:ios
      - run: npm run verify:ios
