// Builds the plugin's Kotlin on its own for the unit tests, over the same dependencies the app gives it.
pluginManagement {
    repositories {
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
        maven {
            url = 'https://raw.githubusercontent.com/hotcodepush-team/core-android/maven/'
            content { includeGroup 'com.hotcodepush' }
        }
    }
}

rootProject.name = 'cordova-code-push'
