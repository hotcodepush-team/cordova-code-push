// Builds the plugin's Kotlin on its own for the unit tests, over the same dependencies the app gives it.
pluginManagement {
    repositories {
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
        maven {
            url = file('../../src/android/libs/m2')
            content { includeGroup 'com.hotcodepush' }
        }
    }
}

rootProject.name = 'cordova-code-push'
