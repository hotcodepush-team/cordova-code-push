// Cordova applies this file to the app's build.gradle from plugin.xml.
// Any build type other than debug is a store build, which creates the binary.

import javax.inject.Inject
import org.apache.tools.ant.taskdefs.condition.Os

// The core comes from core-android's maven branch at a pinned commit until the library is on Maven Central.
repositories {
    maven {
        url 'https://raw.githubusercontent.com/hotcodepush-team/core-android/maven/'
        content { includeGroup 'com.hotcodepush' }
    }
}

dependencies {
    implementation 'com.hotcodepush:core-android:429070ec80066b8f21396434d1e608b0317d34a3'
    implementation "androidx.webkit:webkit:${cordovaConfig.ANDROIDX_WEBKIT_VERSION}"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}

abstract class HotCodePushBinaryCreateTask extends DefaultTask {
    @Input
    abstract Property<String> getBinaryBuild()

    @Input
    abstract Property<String> getBinaryVersion()

    @Input
    abstract Property<Boolean> getIsStoreBuild()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @Internal
    abstract DirectoryProperty getProjectRoot()

    @InputDirectory
    abstract DirectoryProperty getWwwDirectory()

    @Inject
    abstract ExecOperations getExecOperations()

    @TaskAction
    void createBinary() {
        def npx = Os.isFamily(Os.FAMILY_WINDOWS) ? ['cmd', '/c', 'npx'] : ['npx']
        def command = isStoreBuild.get()
            ? ['binary', 'create', '--binary-version', binaryVersion.get(), '--binary-build', binaryBuild.get()]
            : ['resource-file', 'write']
        execOperations.exec {
            it.workingDir = projectRoot.get().asFile
            it.commandLine(npx + ['hotcodepush'] + command + [
                '--platform', 'android',
                '--embedded-bundle-path', wwwDirectory.get().asFile.path,
                '--resource-file-path', outputDirectory.file('www/hotcodepush.json').get().asFile.path,
            ])
        }
    }
}

androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    def binaryCreateTask = tasks.register("createHotCodePushBinary${variant.name.capitalize()}", HotCodePushBinaryCreateTask) {
        it.group = 'hotcodepush'
        it.description = "Writes hotcodepush.json into the ${variant.name} assets and creates the binary of a store build."
        it.binaryBuild.set(variant.outputs[0].versionCode.map { String.valueOf(it) })
        it.binaryVersion.set(variant.outputs[0].versionName)
        it.isStoreBuild.set(variant.buildType != 'debug')
        // The Cordova project, two levels above the platform's Gradle project.
        it.projectRoot.set(rootProject.layout.projectDirectory.dir('../..'))
        it.wwwDirectory.set(layout.projectDirectory.dir('src/main/assets/www'))
        // The resource file carries the build time, and a store build creates its binary on every run.
        it.outputs.upToDateWhen { false }
    }
    variant.sources.assets.addGeneratedSourceDirectory(binaryCreateTask) { it.outputDirectory }
}
