// The core comes from protocol-android at a pinned commit, built by JitPack until the library is published.
repositories {
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'com.github.hotcodepush-team:protocol-android:36b1f01f43b986ae268dc1e1a8be43363fcb9348'
    implementation "androidx.webkit:webkit:${cordovaConfig.ANDROIDX_WEBKIT_VERSION}"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
