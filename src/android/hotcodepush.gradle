// The core comes from protocol-android at a pinned commit, built by JitPack until the library is published.
repositories {
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'com.github.hotcodepush-team:protocol-android:e240ea1c49df64c06518cfaef0433df79a10b1fe'
    implementation "androidx.webkit:webkit:${cordovaConfig.ANDROIDX_WEBKIT_VERSION}"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
