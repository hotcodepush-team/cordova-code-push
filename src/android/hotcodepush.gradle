// The core comes from protocol-android at a pinned commit, built by JitPack until the library is published.
repositories {
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'com.github.hotcodepush-team:protocol-android:a40d49816a4e92fd3f6a41e4e59ab1e2ec626d52'
    implementation "androidx.webkit:webkit:${cordovaConfig.ANDROIDX_WEBKIT_VERSION}"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
